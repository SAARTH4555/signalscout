name: CI
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main, "feature/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI never touches the network: every fetch in tests is served from recorded fixtures,
# so no job board, SEC or company website is contacted. No secrets are needed.
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - run: uv sync --locked --group dev
      - run: uv run pytest --cov --cov-report=term-missing
      - name: End-to-end offline run on the recorded demo world
        run: uv run signalscout run --offline --out /tmp/signalscout-out

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.12" }
      - run: uv build
      - name: Wheel installs and the CLI runs
        run: |
          uv venv /tmp/wheelcheck
          uv pip install --python /tmp/wheelcheck dist/*.whl
          /tmp/wheelcheck/bin/signalscout version
